---
name: CI
"on":
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  schedule:
    - cron: "0 0 * * WED"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # needed to checkout contents
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025-vs2026
          - windows-2022
        windows-sys:
          - "0.59.0"
          - "0.60.2"
          - "latest"
        exclude:
          - os: windows-2025-vs2026
            windows-sys: "0.59.0"
          - os: windows-2025-vs2026
            windows-sys: "0.60.2"

    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup default stable
          rustup show

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Update windows-sys version to ${{ matrix.windows-sys }}
        run: cargo update -p windows-sys --precise "$env:WINDOWS_SYS_VERSION"
        if: ${{ matrix.windows-sys != 'latest' }}
        env:
          WINDOWS_SYS_VERSION: ${{ matrix.windows-sys }}

      - name: Compile
        run: cargo build --verbose

      - name: Compile tests
        run: cargo test --no-run

      - name: Test
        run: cargo test

      - name: Test with all features
        run: cargo test --all-features

      - name: Test with no default features
        run: cargo test --no-default-features

      - name: Check example
        run: cargo check --examples

      - name: Build examples
        run: cargo build --examples

      - name: Run example
        run: cargo run --example get_profile_dir -q

  build-msrv:
    name: Build (MSRV)
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.60.0 --profile minimal
          rustup default 1.60.0
          rustup show

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Update windows-sys version to minimum in range
        run: cargo update -p windows-sys --precise "0.60.2"

      - name: Compile
        run: cargo build --verbose

      - name: Compile tests
        run: cargo test --no-run

      - name: Test
        run: cargo test

      - name: Test with all features
        run: cargo test --all-features

      - name: Test with no default features
        run: cargo test --no-default-features

      - name: Check example
        run: cargo check --examples

      - name: Build examples
        run: cargo build --examples

      - name: Run example
        run: cargo run --example get_profile_dir -q

  build-non-windows:
    name: Build (non-Windows platforms)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup default stable
          rustup show

      - name: Compile
        run: cargo build --verbose

      - name: Compile tests
        run: cargo test --no-run

      - name: Test
        run: cargo test

      - name: Test with all features
        run: cargo test --all-features

      - name: Test with no default features
        run: cargo test --no-default-features

      - name: Check example
        run: cargo check --examples

      - name: Build examples
        run: cargo build --examples

      - name: Run example
        shell: bash
        run: |
          error_code="0"
          cargo run --example get_profile_dir -q || error_code="$?"
          [[ "$error_code" == "1" ]]

  rust:
    name: Lint and format Rust
    runs-on: windows-2025-vs2026
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup show

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-features --all-targets

      - name: Install Rustdoc toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup show

      - name: Check docs with no default features
        run: cargo +nightly doc --workspace --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links --cfg docsrs

      - name: Build docs
        run: cargo +nightly doc --workspace
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links --cfg docsrs

  text:
    name: Lint and format text
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
        with:
          run_install: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Format with prettier
        run: pnpm run fmt:check
